<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IntelligentForce · AI Office</title>
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #050a14; color: #fff; min-height: 100vh; }

    /* ── LOGIN ── */
    #login-screen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;
    }
    .login-box { width: 100%; max-width: 360px; }
    .login-header { text-align: center; margin-bottom: 2rem; }
    .login-icon {
      width: 64px; height: 64px; border-radius: 16px;
      background: linear-gradient(135deg, rgba(6,182,212,.2), rgba(37,99,235,.2));
      border: 1px solid rgba(6,182,212,.3);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 1rem; font-size: 28px;
    }
    .login-header h1 { font-size: 1.5rem; font-weight: 800; }
    .login-header p { color: #6b7280; font-size: .875rem; margin-top: .25rem; }
    .login-card { background: #0d1829; border: 1px solid rgba(255,255,255,.08); border-radius: 20px; padding: 2rem; }
    .field { margin-bottom: 1.25rem; }
    .field label { display: block; font-size: .75rem; color: #9ca3af; margin-bottom: .375rem; font-weight: 500; }
    .pw-wrap { position: relative; }
    .field input {
      width: 100%; background: #0a1020; border: 1px solid rgba(255,255,255,.1);
      border-radius: 12px; padding: .75rem 2.5rem .75rem 1rem;
      font-size: .875rem; color: #fff; outline: none; transition: border-color .2s; font-family: inherit;
    }
    .field input:focus { border-color: rgba(6,182,212,.5); }
    .toggle-pw { position: absolute; right: .75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #6b7280; font-size: 1rem; }
    .error-msg { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.2); border-radius: 10px; padding: .5rem .75rem; font-size: .75rem; color: #f87171; margin-bottom: 1rem; display: none; }
    .btn-login { width: 100%; background: linear-gradient(135deg, #06b6d4, #2563eb); border: none; border-radius: 12px; padding: .875rem; font-size: .875rem; font-weight: 700; color: #fff; cursor: pointer; font-family: inherit; }
    .btn-login:hover { opacity: .9; }

    /* ── OFFICE ── */
    #office { display: none; height: 100vh; flex-direction: column; }

    /* Top bar */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: .75rem 1.25rem; background: #0a1020;
      border-bottom: 1px solid rgba(255,255,255,.08); flex-shrink: 0;
    }
    .topbar-left { display: flex; align-items: center; gap: .75rem; }
    .topbar-logo { height: 32px; width: auto; object-fit: contain; }
    .topbar-title { font-size: .875rem; font-weight: 700; }
    .topbar-sub { font-size: .7rem; color: #06b6d4; }
    .topbar-right { display: flex; align-items: center; gap: .75rem; }
    .live-badge { display: flex; align-items: center; gap: .375rem; font-size: .7rem; color: #22c55e; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .btn-sm { font-size: .75rem; color: #6b7280; background: none; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: .3rem .65rem; cursor: pointer; font-family: inherit; }
    .btn-sm:hover { color: #fff; }

    /* Main layout */
    .office-body { display: flex; flex: 1; overflow: hidden; }

    /* ── LEFT: ALEX ── */
    .alex-panel {
      width: 340px; flex-shrink: 0; display: flex; flex-direction: column;
      border-right: 1px solid rgba(255,255,255,.08); background: #080f1e;
    }
    .alex-header {
      padding: 1rem; border-bottom: 1px solid rgba(255,255,255,.08);
      display: flex; align-items: center; gap: .75rem;
    }
    .alex-avatar-wrap { position: relative; }
    .alex-avatar {
      width: 44px; height: 44px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(6,182,212,.3), rgba(37,99,235,.3));
      border: 1px solid rgba(6,182,212,.4);
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem;
    }
    .online-dot { position: absolute; bottom: -2px; right: -2px; width: 12px; height: 12px; background: #22c55e; border-radius: 50%; border: 2px solid #080f1e; animation: pulse 2s infinite; }
    .alex-info strong { font-size: .9rem; font-weight: 700; display: block; }
    .alex-info span { font-size: .7rem; color: #06b6d4; }
    .alex-messages { flex: 1; overflow-y: auto; padding: .875rem; display: flex; flex-direction: column; gap: .625rem; }
    .alex-messages::-webkit-scrollbar { width: 3px; }
    .alex-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }
    .msg { display: flex; gap: .4rem; }
    .msg.user { flex-direction: row-reverse; }
    .msg-icon { width: 24px; height: 24px; border-radius: 7px; background: rgba(6,182,212,.2); border: 1px solid rgba(6,182,212,.3); display: flex; align-items: center; justify-content: center; font-size: .65rem; flex-shrink: 0; margin-top: 2px; }
    .msg-bubble { max-width: 85%; border-radius: 14px; padding: .5rem .75rem; font-size: .8rem; line-height: 1.5; }
    .msg.assistant .msg-bubble { background: #0d1829; border: 1px solid rgba(255,255,255,.07); color: rgba(255,255,255,.9); }
    .msg.user .msg-bubble { background: rgba(6,182,212,.15); border: 1px solid rgba(6,182,212,.3); color: #fff; }
    .msg-time { font-size: .6rem; color: #374151; margin-top: .2rem; }
    .msg.user .msg-time { text-align: right; }
    .typing { display: none; align-items: center; gap: .4rem; padding: 0 .875rem .375rem; }
    .typing.show { display: flex; }
    .typing-dot { width: 5px; height: 5px; border-radius: 50%; background: #06b6d4; animation: bounce .8s infinite; }
    .typing-dot:nth-child(2){animation-delay:.15s} .typing-dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}
    .alex-input-row { border-top: 1px solid rgba(255,255,255,.08); padding: .625rem; display: flex; gap: .4rem; align-items: flex-end; }
    .alex-input-row textarea { flex: 1; background: #0a1020; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: .5rem .75rem; font-size: .8rem; color: #fff; resize: none; outline: none; font-family: inherit; min-height: 36px; max-height: 100px; line-height: 1.4; }
    .alex-input-row textarea:focus { border-color: rgba(6,182,212,.5); }
    .alex-input-row textarea::placeholder { color: #4b5563; }
    .send-btn { width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; background: rgba(6,182,212,.2); border: 1px solid rgba(6,182,212,.3); color: #06b6d4; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: .875rem; }
    .send-btn:hover { background: rgba(6,182,212,.35); }
    .send-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── MIDDLE: AGENTS ── */
    .agents-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .agents-header { padding: .875rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; justify-content: space-between; }
    .agents-header h2 { font-size: .875rem; font-weight: 700; }
    .agents-header span { font-size: .7rem; color: #6b7280; }
    .agents-grid { flex: 1; overflow-y: auto; padding: 1rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .75rem; align-content: start; }
    .agents-grid::-webkit-scrollbar { width: 3px; }
    .agents-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }
    .agent-card {
      background: #0d1829; border: 1px solid rgba(255,255,255,.08); border-radius: 16px;
      padding: .875rem; cursor: pointer; transition: border-color .2s, background .2s;
    }
    .agent-card:hover { border-color: rgba(6,182,212,.3); background: #0f1f35; }
    .agent-card.active { border-color: rgba(6,182,212,.5); background: #0f1f35; }
    .agent-card-top { display: flex; align-items: center; gap: .625rem; margin-bottom: .625rem; }
    .agent-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .agent-name { font-size: .8rem; font-weight: 700; }
    .agent-role { font-size: .65rem; color: #6b7280; margin-top: .1rem; }
    .agent-status { display: flex; align-items: center; gap: .375rem; font-size: .65rem; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; }
    .status-dot.online { background: #22c55e; animation: pulse 2s infinite; }
    .status-dot.busy { background: #f59e0b; }
    .status-dot.idle { background: #6b7280; }
    .agent-last { font-size: .65rem; color: #4b5563; margin-top: .5rem; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Agent chat modal */
    .agent-modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7);
      z-index: 100; align-items: center; justify-content: center; padding: 1rem;
    }
    .agent-modal.open { display: flex; }
    .agent-modal-box {
      background: #0d1829; border: 1px solid rgba(6,182,212,.3); border-radius: 20px;
      width: 100%; max-width: 480px; max-height: 80vh; display: flex; flex-direction: column;
    }
    .modal-header { padding: 1rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; justify-content: space-between; }
    .modal-header-left { display: flex; align-items: center; gap: .75rem; }
    .modal-close { background: none; border: none; color: #6b7280; cursor: pointer; font-size: 1.2rem; }
    .modal-messages { flex: 1; overflow-y: auto; padding: .875rem; display: flex; flex-direction: column; gap: .625rem; min-height: 200px; }
    .modal-messages::-webkit-scrollbar { width: 3px; }
    .modal-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }
    .modal-input-row { border-top: 1px solid rgba(255,255,255,.08); padding: .75rem; display: flex; gap: .5rem; }
    .modal-input-row input { flex: 1; background: #0a1020; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; padding: .5rem .75rem; font-size: .8rem; color: #fff; outline: none; font-family: inherit; }
    .modal-input-row input:focus { border-color: rgba(6,182,212,.5); }
    .modal-send { padding: .5rem 1rem; background: rgba(6,182,212,.2); border: 1px solid rgba(6,182,212,.3); border-radius: 10px; color: #06b6d4; cursor: pointer; font-size: .8rem; font-family: inherit; font-weight: 600; }
    .modal-send:hover { background: rgba(6,182,212,.35); }

    /* ── RIGHT: ACTIVITY FEED ── */
    .feed-panel { width: 260px; flex-shrink: 0; border-left: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; background: #080f1e; }
    .feed-header { padding: .875rem 1rem; border-bottom: 1px solid rgba(255,255,255,.08); }
    .feed-header h3 { font-size: .8rem; font-weight: 700; }
    .feed-header span { font-size: .65rem; color: #6b7280; }
    .feed-list { flex: 1; overflow-y: auto; padding: .75rem; display: flex; flex-direction: column; gap: .5rem; }
    .feed-list::-webkit-scrollbar { width: 3px; }
    .feed-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }
    .feed-item { background: #0d1829; border: 1px solid rgba(255,255,255,.06); border-radius: 10px; padding: .5rem .625rem; }
    .feed-item-top { display: flex; align-items: center; gap: .375rem; margin-bottom: .25rem; }
    .feed-agent-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .feed-agent-name { font-size: .65rem; font-weight: 600; color: #9ca3af; }
    .feed-time { font-size: .6rem; color: #374151; margin-left: auto; }
    .feed-text { font-size: .7rem; color: rgba(255,255,255,.7); line-height: 1.4; }

    /* Quick links bottom */
    .quick-bar { padding: .75rem 1rem; border-top: 1px solid rgba(255,255,255,.08); display: flex; gap: .5rem; flex-wrap: wrap; }
    .quick-link { font-size: .7rem; color: #6b7280; text-decoration: none; border: 1px solid rgba(255,255,255,.08); border-radius: 7px; padding: .25rem .5rem; transition: color .2s; }
    .quick-link:hover { color: #06b6d4; border-color: rgba(6,182,212,.3); }

    @media (max-width: 768px) {
      .feed-panel { display: none; }
      .alex-panel { width: 100%; border-right: none; }
      .agents-panel { display: none; }
      .alex-panel { display: flex; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-header">
      <div class="login-icon">✦</div>
      <h1>IntelligentForce</h1>
      <p>AI Office · Kun for Valdi</p>
    </div>
    <div class="login-card">
      <div class="field">
        <label>Passord</label>
        <div class="pw-wrap">
          <input type="password" id="pw-input" placeholder="••••••••••••••••" autocomplete="current-password" />
          <button class="toggle-pw" onclick="togglePw()">👁</button>
        </div>
      </div>
      <div class="error-msg" id="login-error">Feil passord. Prøv igjen.</div>
      <button class="btn-login" onclick="doLogin()">Logg inn</button>
    </div>
  </div>
</div>

<!-- OFFICE -->
<div id="office">
  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <img src="/logo.png?v=2" class="topbar-logo" alt="IF" onerror="this.style.display='none'" style="height:48px" />
      <div>
        <div class="topbar-title">IntelligentForce AI Office</div>
        <div class="topbar-sub">ALEX & 9 Agents · Active</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="live-badge"><div class="live-dot"></div> Live</div>
      <button class="btn-sm" onclick="doLogout()">Logg ut</button>
    </div>
  </div>

  <div class="office-body">

    <!-- LEFT: ALEX -->
    <div class="alex-panel">
      <div class="alex-header">
        <div class="alex-avatar-wrap">
          <div class="alex-avatar">✦</div>
          <div class="online-dot"></div>
        </div>
        <div class="alex-info">
          <strong>ALEX</strong>
          <span>Chief AI Coordinator</span>
        </div>
      </div>
      <div class="alex-messages" id="alex-messages"></div>
      <div class="typing" id="alex-typing">
        <div class="msg-icon">✦</div>
        <div style="display:flex;gap:3px;align-items:center">
          <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
        </div>
      </div>
      <div class="alex-input-row">
        <textarea id="alex-input" placeholder="Skriv til ALEX... (Enter)" rows="1"
          onkeydown="handleAlexKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="alex-send" onclick="sendToAlex()">➤</button>
      </div>
    </div>

    <!-- MIDDLE: AGENTS -->
    <div class="agents-panel">
      <div class="agents-header">
        <h2>AI Agenter</h2>
        <span id="agents-online-count">9 agenter online</span>
      </div>
      <div class="agents-grid" id="agents-grid"></div>
    </div>

    <!-- RIGHT: FEED -->
    <div class="feed-panel">
      <div class="feed-header">
        <h3>Live Aktivitet</h3>
        <span>Agent-kommunikasjon</span>
      </div>
      <div class="feed-list" id="feed-list"></div>
      <div class="quick-bar">
        <a class="quick-link" href="https://formspree.io/login" target="_blank">Formspree</a>
        <a class="quick-link" href="/" target="_blank">Portal</a>
        <a class="quick-link" href="/health-check" target="_blank">Health Check</a>
        <a class="quick-link" href="mailto:hello@intelligentforce.ai">E-post</a>
      </div>
    </div>
  </div>
</div>

<!-- AGENT MODAL -->
<div class="agent-modal" id="agent-modal">
  <div class="agent-modal-box">
    <div class="modal-header">
      <div class="modal-header-left">
        <div class="agent-icon" id="modal-icon" style="background:rgba(6,182,212,.2)"></div>
        <div>
          <div style="font-size:.875rem;font-weight:700" id="modal-name"></div>
          <div style="font-size:.7rem;color:#06b6d4" id="modal-role"></div>
        </div>
      </div>
      <button class="modal-close" onclick="closeAgentModal()">✕</button>
    </div>
    <div class="modal-messages" id="modal-messages"></div>
    <div class="modal-input-row">
      <input type="text" id="modal-input" placeholder="Skriv til agenten... (Enter)" onkeydown="handleModalKey(event)" />
      <button class="modal-send" onclick="sendToAgent()">Send</button>
    </div>
  </div>
</div>

<script>
const PASS = "IF@Admin2026!Secure";
const WORKER_URL = "https://alex-ai-worker.vladimir-joffcheff.workers.dev";

const AGENTS = [
  { id: "data", name: "Data Analyst", role: "Rapporter & Analyse", icon: "📊", color: "#3b82f6", specialty: "dataanalyse, rapporter, statistikk og innsikt fra bedriftsdata" },
  { id: "customer", name: "Customer Service", role: "Kundeservice 24/7", icon: "💬", color: "#06b6d4", specialty: "kundehenvendelser, support, FAQ og kundetilfredshet" },
  { id: "process", name: "Process Optimizer", role: "Prosesseffektivisering", icon: "⚙️", color: "#8b5cf6", specialty: "prosessoptimalisering, flaskehalser, automatisering og effektivitet" },
  { id: "market", name: "Market Analyst", role: "Markedsintelligens", icon: "📈", color: "#10b981", specialty: "markedsanalyse, konkurrenter, trender og vekstmuligheter" },
  { id: "risk", name: "Risk Manager", role: "Risiko & Compliance", icon: "🛡️", color: "#f59e0b", specialty: "risikovurdering, compliance, regelverk og sikkerhet" },
  { id: "content", name: "Content Creator", role: "Innhold & Kommunikasjon", icon: "✍️", color: "#ec4899", specialty: "innholdsproduksjon, markedsføring, blogg og kommunikasjon" },
  { id: "supply", name: "Supply Chain", role: "Forsyningskjede", icon: "🚚", color: "#f97316", specialty: "innkjøp, logistikk, leverandører og forsyningskjede" },
  { id: "hr", name: "HR Specialist", role: "HR & Rekruttering", icon: "👥", color: "#a78bfa", specialty: "rekruttering, onboarding, HR-administrasjon og medarbeideropplevelse" },
  { id: "finance", name: "Financial Analyst", role: "Finans & Regnskap", icon: "💰", color: "#34d399", specialty: "finansiell rapportering, budsjettering, prognoser og regnskapsanalyse" },
];

let alexMessages = [];
let agentMessages = {}; // { agentId: [{role, content}] }
let currentAgent = null;

// ── LOGIN ──
document.getElementById('pw-input').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
function doLogin() {
  const pw = document.getElementById('pw-input').value;
  if (pw === PASS) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('office').style.display = 'flex';
    initOffice();
  } else {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}
function doLogout() {
  document.getElementById('office').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('pw-input').value = '';
}
function togglePw() {
  const inp = document.getElementById('pw-input');
  inp.type = inp.type === 'password' ? 'text' : 'password';
}

// ── INIT OFFICE ──
function initOffice() {
  renderAgents();
  addAlexMsg("assistant", "God dag, Valdi! Alle 9 agenter er online og klare. Jeg koordinerer teamet og holder oversikt over plattformen. Hva skal vi fokusere på i dag?");
  startActivityFeed();
}

// ── AGENTS GRID ──
function renderAgents() {
  const grid = document.getElementById('agents-grid');
  grid.innerHTML = '';
  AGENTS.forEach(agent => {
    agentMessages[agent.id] = [];
    const card = document.createElement('div');
    card.className = 'agent-card';
    card.id = 'agent-card-' + agent.id;
    card.onclick = () => openAgentModal(agent);
    card.innerHTML = `
      <div class="agent-card-top">
        <div class="agent-icon" style="background:${agent.color}22;border:1px solid ${agent.color}44">${agent.icon}</div>
        <div>
          <div class="agent-name">${agent.name}</div>
          <div class="agent-role">${agent.role}</div>
        </div>
      </div>
      <div class="agent-status">
        <div class="status-dot online"></div>
        <span style="color:#22c55e">Online</span>
      </div>
      <div class="agent-last" id="agent-last-${agent.id}">Klar for oppgaver</div>
    `;
    grid.appendChild(card);
  });
}

// ── ALEX CHAT ──
function addAlexMsg(role, content) {
  alexMessages.push({ role, content });
  const container = document.getElementById('alex-messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const time = new Date().toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
  div.innerHTML = role === 'assistant'
    ? `<div class="msg-icon">✦</div><div><div class="msg-bubble">${escHtml(content)}</div><div class="msg-time">${time}</div></div>`
    : `<div><div class="msg-bubble">${escHtml(content)}</div><div class="msg-time" style="text-align:right">${time}</div></div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function sendToAlex() {
  const inp = document.getElementById('alex-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = 'auto';
  document.getElementById('alex-send').disabled = true;
  addAlexMsg('user', text);
  const typing = document.getElementById('alex-typing');
  typing.classList.add('show');
  document.getElementById('alex-messages').scrollTop = 99999;
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: alexMessages.map(m => ({ role: m.role, content: m.content })),
        adminMode: true
      })
    });
    const data = await res.json();
    typing.classList.remove('show');
    addAlexMsg('assistant', data.reply || 'Beklager, teknisk problem. Prøv igjen.');
    addFeedItem('ALEX', '#06b6d4', 'Svarte Valdi på forespørsel');
  } catch(e) {
    typing.classList.remove('show');
    addAlexMsg('assistant', 'Beklager, Valdi — midlertidig teknisk problem. Prøv igjen om litt.');
  }
  document.getElementById('alex-send').disabled = false;
}

function handleAlexKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendToAlex(); }
}

// ── AGENT MODAL ──
function openAgentModal(agent) {
  currentAgent = agent;
  document.getElementById('modal-icon').textContent = agent.icon;
  document.getElementById('modal-icon').style.background = agent.color + '22';
  document.getElementById('modal-name').textContent = agent.name;
  document.getElementById('modal-role').textContent = agent.role;
  const container = document.getElementById('modal-messages');
  container.innerHTML = '';
  if (agentMessages[agent.id].length === 0) {
    const greetDiv = document.createElement('div');
    greetDiv.className = 'msg assistant';
    greetDiv.innerHTML = `<div class="msg-icon">${agent.icon}</div><div><div class="msg-bubble" style="background:#0a1020;border:1px solid rgba(255,255,255,.07);font-size:.8rem">Hei, Valdi! Jeg er ${agent.name}. Spesialist på ${agent.specialty}. Hva kan jeg hjelpe deg med?</div></div>`;
    container.appendChild(greetDiv);
  } else {
    agentMessages[agent.id].forEach(m => renderAgentMsg(m.role, m.content, agent));
  }
  document.getElementById('agent-modal').classList.add('open');
  setTimeout(() => document.getElementById('modal-input').focus(), 100);
}

function closeAgentModal() {
  document.getElementById('agent-modal').classList.remove('open');
  currentAgent = null;
}

function renderAgentMsg(role, content, agent) {
  const container = document.getElementById('modal-messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const time = new Date().toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
  div.innerHTML = role === 'assistant'
    ? `<div class="msg-icon">${agent.icon}</div><div><div class="msg-bubble" style="background:#0a1020;border:1px solid rgba(255,255,255,.07);font-size:.8rem">${escHtml(content)}</div><div class="msg-time">${time}</div></div>`
    : `<div><div class="msg-bubble" style="background:rgba(6,182,212,.15);border:1px solid rgba(6,182,212,.3);font-size:.8rem">${escHtml(content)}</div><div class="msg-time" style="text-align:right">${time}</div></div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

async function sendToAgent() {
  if (!currentAgent) return;
  const inp = document.getElementById('modal-input');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  agentMessages[currentAgent.id].push({ role: 'user', content: text });
  renderAgentMsg('user', text, currentAgent);

  const agentSystemPrompt = `Du er ${currentAgent.name} — en spesialisert AI-agent hos IntelligentForce AI.
Din spesialitet: ${currentAgent.specialty}.
Du rapporterer til ALEX (Chief AI Coordinator) og til Valdi (CEO og grunnlegger).
Du er profesjonell, presis og resultatorientert. Svar på norsk med mindre brukeren skriver på engelsk.
Hold svarene konsise og handlingsorienterte. Du er ikke en chatbot — du er en ansatt AI-spesialist.`;

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        messages: [
          { role: 'user', content: agentSystemPrompt + '\n\n---\n\n' + text }
        ],
        adminMode: false
      })
    });
    const data = await res.json();
    const reply = data.reply || 'Beklager, teknisk problem.';
    agentMessages[currentAgent.id].push({ role: 'assistant', content: reply });
    renderAgentMsg('assistant', reply, currentAgent);
    document.getElementById('agent-last-' + currentAgent.id).textContent = reply.substring(0, 50) + '...';
    addFeedItem(currentAgent.name, currentAgent.color, 'Svarte på forespørsel fra Valdi');
  } catch(e) {
    renderAgentMsg('assistant', 'Beklager, teknisk problem. Prøv igjen.', currentAgent);
  }
}

function handleModalKey(e) {
  if (e.key === 'Enter') sendToAgent();
}

const feedEvents = [
  { agent: 'ALEX', color: '#06b6d4', text: 'Koordinerer alle 9 agenter' },
  { agent: 'Data Analyst', color: '#3b82f6', text: 'Analyserer plattformtrafikk' },
  { agent: 'Customer Service', color: '#06b6d4', text: 'Klar for kundehenvendelser' },
  { agent: 'Market Analyst', color: '#10b981', text: 'Overvåker markedstrender' },
  { agent: 'Financial Analyst', color: '#34d399', text: 'Forbereder månedlig rapport' },
  { agent: 'Process Optimizer', color: '#8b5cf6', text: 'Identifiserer optimaliseringsmuligheter' },
  { agent: 'Content Creator', color: '#ec4899', text: 'Oppdaterer innholdsstrategi' },
  { agent: 'HR Specialist', color: '#a78bfa', text: 'Gjennomgår onboarding-prosess' },
  { agent: 'Risk Manager', color: '#f59e0b', text: 'Compliance-sjekk fullført' },
  { agent: 'Supply Chain', color: '#f97316', text: 'Leverandørstatus oppdatert' },
];

function addFeedItem(agentName, color, text) {
  const list = document.getElementById('feed-list');
  const time = new Date().toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
  const div = document.createElement('div');
  div.className = 'feed-item';
  div.innerHTML = `
    <div class="feed-item-top">
      <div class="feed-agent-dot" style="background:${color}"></div>
      <span class="feed-agent-name">${agentName}</span>
      <span class="feed-time">${time}</span>
    </div>
    <div class="feed-text">${text}</div>
  `;
  list.insertBefore(div, list.firstChild);
  if (list.children.length > 30) list.removeChild(list.lastChild);
}

function startActivityFeed() {
  feedEvents.forEach(e => addFeedItem(e.agent, e.color, e.text));
  setInterval(() => {
    const e = feedEvents[Math.floor(Math.random() * feedEvents.length)];
    addFeedItem(e.agent, e.color, e.text);
  }, 12000);
}

// ── UTILS ──
function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}
</script>
