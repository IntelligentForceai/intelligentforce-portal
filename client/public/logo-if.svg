<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 90" fill="none">
  <defs>
    <linearGradient id="gradI" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1a3a6e"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gradF" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- I: shorter, darker, starts lower -->
  <rect x="4" y="14" width="14" height="62" rx="1" fill="url(#gradI)"/>
  <!-- F: taller, lighter teal -->
  <rect x="24" y="4" width="14" height="72" rx="1" fill="url(#gradF)"/>
  <!-- F top bar -->
  <rect x="24" y="4" width="38" height="13" rx="1" fill="url(#gradF)"/>
  <!-- F middle bar -->
  <rect x="24" y="34" width="30" height="12" rx="1" fill="url(#gradF)"/>
</svg>
