<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" fill="none">
  <defs>
    <linearGradient id="gradI" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1a3a8c"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="gradF" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- I: same height as F, diagonal top going upward left-to-right -->
  <polygon points="94,18 112,10 112,96 94,96" fill="url(#gradI)"/>

  <!-- F: same height, diagonal top going upward left-to-right, solid letter, thicker -->
  <polygon points="
    118,10
    192,2
    192,18
    134,24
    134,48
    178,42
    178,58
    134,62
    134,96
    118,96
  " fill="url(#gradF)"/>

  <!-- Text: INTELLIGENT FORCE -->
  <text x="150" y="120" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0f2744" text-anchor="middle" letter-spacing="2">INTELLIGENT FORCE</text>

  <!-- Subtext: AI DRIVEN SOLUTIONS -->
  <text x="150" y="138" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="400" fill="#334e7a" text-anchor="middle" letter-spacing="3">AI DRIVEN SOLUTIONS</text>
</svg>
